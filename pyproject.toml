[project]
name = "agent-workspace"
description = "Multi-environment Agent workspace manager (agentctl)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]
dynamic = ["version"]

[project.scripts]
agentctl = "agentctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+\\S*)$"

[tool.hatch.build.targets.wheel]
packages = ["agentctl"]

[dependency-groups]
dev = ["pytest>=8.0"]