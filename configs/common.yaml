# Baseline applied to every machine before the environment profile.
# Effective Config = common + <profile> + local.yaml (machine layer)
description: Shared baseline for all machines

# skills enabled everywhere (lists merge by union across layers)
skills:
  - agent-reach
  - andes-aice-bringup
  - ask-matt
  - code-review
  - codebase-design
  - define-bounded-goal
  - diagnosing-bugs
  - domain-modeling
  - find-skills
  - firmware-mentor
  - git-delivery
  - git-helper
  - grill-me
  - grill-with-docs
  - grilling
  - handoff
  - implement
  - improve-codebase-architecture
  - onenote
  - pack-to-dts
  - project-structure
  - prototype
  - pyside6-fluent-ui
  - python-helper
  - qt-ui-design
  - reg-to-ll
  - research
  - resolving-merge-conflicts
  - run-tickets
  - serial-debug
  - setup-matt-pocock-skills
  - tdd
  - teach
  - to-questionnaire
  - to-spec
  - to-tickets
  - triage
  - ui-ux-pro-max
  - wait-what
  - wayfinder
  - wizard
  - writing-for-agents

# How skills/ reaches the agent tools on this machine.
#   strategy: auto | symlink | junction | copy
#   auto -> symlink, then junction (Windows), then copy
# targets are machine paths; overriding them in a higher layer REPLACES
# this list (they are machine-specific, so unioning would be wrong)
links:
  strategy: auto
  targets:
    - ~/.agents/skills

# doctor checks these tools (git and python are always checked)
tools:
  git: {}
  python: ">=3.10"
  uv: {}
  node: {}
  npm: {}
  skills: {}

# secret NAMES only - values live in .env, which never enters git or bundles
secrets:
  required: []
  optional:
    - OPENAI_API_KEY
    - LOCAL_LLM_URL

network:
  internet: true

# 应用配置：声明本机应用的配置目录与备份范围。
# capture 抓取到 user-data/（gitignored）走私有渠道；deploy 从目录/ZIP 恢复，
# 覆盖前自动备份。剪贴板历史等个人数据永不进入 Git / 离线包 / 公开仓库。
app_configs:
  copyq:
    description: CopyQ 剪贴板管理器（配置与历史；主题内嵌于 copyq.ini [Theme]）
    target: "%APPDATA%/copyq"
    process: copyq.exe
    include:
      - copyq.ini
      - copyq-commands.ini
      - copyq_tabs.ini
      - copyq-filter.ini
      - copyq_geometry.ini
      - copyq_tab_*.dat
    exclude:
      - "*.bak"
      - "*.bak.*"
      - "*.new.bak"
      - "*.log"

# resources: 期望清单，供 agentctl scan/diff 与基线对比
# skills = vercel-labs/skills CLI；本机 npm ls -g 不输出 resolved 来源字段，
# adopt 按设计拒绝猜测来源，此处为已知 registry 来源的手动登记
resources:
  npm:
    skills:
      version: null
