# Baseline applied to every machine before the environment profile.
# Effective Config = common + <profile> + local.yaml (machine layer)
description: Shared baseline for all machines

# skills enabled everywhere (lists merge by union across layers)
skills:
  - agent-reach
  - andes-aice-bringup
  - ask-matt
  - code-review
  - codebase-design
  - define-bounded-goal
  - diagnosing-bugs
  - domain-modeling
  - firmware-mentor
  - git-delivery
  - git-helper
  - grill-me
  - grill-with-docs
  - grilling
  - handoff
  - implement
  - improve-codebase-architecture
  - onenote
  - pack-to-dts
  - project-structure
  - prototype
  - pyside6-fluent-ui
  - python-helper
  - qt-ui-design
  - reg-to-ll
  - research
  - resolving-merge-conflicts
  - run-tickets
  - serial-debug
  - setup-matt-pocock-skills
  - tdd
  - teach
  - to-questionnaire
  - to-spec
  - to-tickets
  - triage
  - wait-what
  - wayfinder
  - wizard
  - writing-for-agents

# How skills/ reaches the agent tools on this machine.
#   strategy: auto | symlink | junction | copy
#   auto -> symlink, then junction (Windows), then copy
# targets are machine paths; overriding them in a higher layer REPLACES
# this list (they are machine-specific, so unioning would be wrong)
links:
  strategy: auto
  targets:
    - ~/.agents/skills

# doctor checks these tools (git and python are always checked)
tools:
  git: {}
  python: ">=3.10"
  uv: {}
  node: {}
  npm: {}

# secret NAMES only - values live in .env, which never enters git or bundles
secrets:
  required: []
  optional:
    - OPENAI_API_KEY
    - LOCAL_LLM_URL

network:
  internet: true
